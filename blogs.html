<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Blogs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
<script src="blogs.js" defer></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f7fb;
padding:30px;
}

.container{

max-width:1300px;
margin:auto;

}

.topbar{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;

}

.topbar h1{

font-size:32px;

}

.search{

width:320px;
padding:12px;
border:1px solid #ccc;
border-radius:8px;

}

table{

width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,.08);

}

th{

background:#2563eb;
color:white;
padding:15px;

}

td{

padding:15px;
border-bottom:1px solid #eee;

}

tr:hover{

background:#f9f9f9;

}

button{

padding:8px 15px;
border:none;
border-radius:6px;
cursor:pointer;
margin-right:5px;

}

.edit{

background:#2563eb;
color:white;

}

.delete{

background:#dc2626;
color:white;

}

.view{

background:#16a34a;
color:white;

}

</style>

</head>

<body>

<div class="container">

<div class="topbar">

<h1>Manage Blogs</h1>

<input
type="text"
id="search"
class="search"
placeholder="Search Blog...">

</div>

<table>

<thead>

<tr>

<th>Title</th>

<th>Category</th>

<th>Author</th>

<th>Date</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="blogTable">

</tbody>

</table>

</div>

</body>

</html>
