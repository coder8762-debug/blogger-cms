<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blogger CMS Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
<script src="dashboard.js" defer></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#0f172a;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h2{
font-size:24px;
}

.container{
max-width:1200px;
margin:40px auto;
padding:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card h3{
margin-bottom:10px;
}

.card p{
font-size:28px;
font-weight:bold;
color:#2563eb;
}

.actions{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

button{
padding:15px;
font-size:16px;
border:none;
border-radius:10px;
cursor:pointer;
background:#2563eb;
color:white;
}

button:hover{
background:#1d4ed8;
}

.logout{
background:#dc2626;
}

.logout:hover{
background:#b91c1c;
}

</style>

</head>

<body>

<header>

<h2>BLOGGER CMS</h2>

<div id="adminEmail">Loading...</div>

</header>

<div class="container">

<div class="cards">

<div class="card">
<h3>Total Blogs</h3>
<p id="totalBlogs">0</p>
</div>

<div class="card">
<h3>Status</h3>
<p>Online</p>
</div>

</div>

<div class="actions">

<button onclick="location.href='add-blog.html'">
➕ Add Blog
</button>

<button onclick="location.href='blogs.html'">
📝 Manage Blogs
</button>

<button class="logout" id="logoutBtn">
Logout
</button>

</div>

</div>

</body>

</html>
