<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Add New Blog</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>

<script src="supabase.js"></script>

<script src="add-blog.js" defer></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#f5f7fb;
color:#222;
}

.container{
width:95%;
max-width:1400px;
margin:35px auto;
}

.header{
margin-bottom:30px;
}

.header h1{
font-size:32px;
font-weight:700;
}

.header p{
margin-top:8px;
color:#666;
}

form{
display:grid;
grid-template-columns:2fr 1fr;
gap:25px;
align-items:start;
}

.card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:12px;
padding:22px;
margin-bottom:25px;
}

.card h2{
font-size:20px;
margin-bottom:20px;
border-bottom:1px solid #eee;
padding-bottom:10px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-size:14px;
font-weight:600;
}

input,
select,
textarea{
width:100%;
padding:12px 14px;
border:1px solid #d7d7d7;
border-radius:8px;
font-size:15px;
outline:none;
transition:.25s;
}

input:focus,
select:focus,
textarea:focus{

border-color:#2563eb;

}

textarea{

resize:vertical;

}

#content{

height:500px;

}

.publish{

width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.publish:hover{

background:#1d4ed8;

}

.image-preview{

margin-top:15px;
height:220px;
border:2px dashed #d8d8d8;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:#fafafa;

}

.image-preview img{

width:100%;
height:100%;
object-fit:cover;
display:none;

}

.image-preview span{

color:#888;

}

small{

display:block;
margin-top:5px;
color:#777;

}

#message{

margin-top:15px;
font-weight:600;

}

@media(max-width:900px){

form{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>Add New Blog</h1>

<p>Create SEO Optimized Blog Post</p>

</div>

<form id="blogForm">

<div>

<div class="card">

<h2>Basic Information</h2>

<div class="form-group">

<label>Blog Title</label>

<input
type="text"
id="title"
required>

</div>

<div class="form-group">

<label>Slug</label>

<input
type="text"
id="slug"
required>

</div>

<div class="form-group">

<label>Author</label>

<input
type="text"
id="author"
required>

</div>

<div class="form-group">

<label>Category</label>

<select id="category">

<option>General</option>

<option>Corporate Law</option>

<option>Criminal Law</option>

<option>Civil Law</option>

<option>Family Law</option>

<option>Legal News</option>

</select>

</div>

<div class="form-group">

<label>Short Description</label>

<textarea
id="description"
rows="4"></textarea>

</div>
<div class="card">

<h2>Blog Content</h2>

<textarea id="content"></textarea>

</div>

</div>

<!-- RIGHT SIDEBAR -->

<div>

<div class="card">

<h2>Featured Image</h2>

<label>Image URL</label>

<input
type="text"
id="image"
readonly
placeholder="Image URL will appear automatically">

<br>

<input
type="file"
id="imageFile"
accept="image/*">

<div class="image-preview">

<img id="previewImage">

<span id="previewText">

No Image Selected

</span>

</div>

</div>

<div class="card">

<h2>SEO Settings</h2>

<div class="form-group">

<label>Meta Title</label>

<input
type="text"
id="metaTitle"
maxlength="60">

<small id="metaTitleCount">

0 / 60

</small>

</div>

<div class="form-group">

<label>Meta Description</label>

<textarea
id="metaDescription"
maxlength="160"
rows="4"></textarea>

<small id="metaDescCount">

0 / 160

</small>

</div>

<div class="form-group">

<label>Focus Keyword</label>

<input
type="text"
id="focusKeyword">

</div>

<div class="form-group">

<label>Canonical URL</label>

<input
type="text"
id="canonical">

</div>

</div>

<div class="card">

<h2>Publishing</h2>

<div class="form-group">

<label>Status</label>

<select id="status">

<option value="Published">

Published

</option>

<option value="Draft">

Draft

</option>

</select>

</div>

<div class="form-group">

<label>

<input
type="checkbox"
id="featured">

 Featured Blog

</label>

</div>

<div class="form-group">

<label>

<input
type="checkbox"
id="comments"
checked>

 Allow Comments

</label>

</div>

<button
type="submit"
class="publish">

Publish Blog

</button>

<div id="message"></div>

</div>

</div>

</form>

</div>

</body>

</html>
