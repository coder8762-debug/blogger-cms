<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blogger CMS Login</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Your JS Files -->
<script src="supabase.js"></script>
<script src="auth.js" defer></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
}

.login-box{
width:420px;
background:#fff;
padding:40px;
border-radius:15px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
}

h1{
text-align:center;
margin-bottom:10px;
color:#111827;
}

p{
text-align:center;
margin-bottom:30px;
color:#64748b;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input{
width:100%;
padding:14px;
margin-bottom:20px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#message{
margin-top:20px;
text-align:center;
font-weight:bold;
}

</style>

</head>

<body>

<div class="login-box">

<h1>BLOGGER CMS</h1>

<p>Admin Login</p>

<form id="loginForm">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<button type="submit">
Login
</button>

</form>

<div id="message"></div>

</div>

</body>

</html>
